name: ADDvEEG
version: 1.0.0+1
description: A new Flutter project.
publish_to: none

environment:
  sdk: '>=2.18.2 <3.0.0'

dependencies:
  auto_size_text: ^3.0.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.2
  dio: ^5.1.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter:
    sdk: flutter
  flutter_bluetooth_seria_changed: ^0.4.0
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^19.1.0
  flutter_map: ^8.1.1
  geocoding: ^2.1.1
  geolocator: ^13.0.4
  get: ^4.6.5
  get_storage: ^2.0.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  http: ^1.0.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  modal_progress_hud_nsn: ^0.5.1
  open_file: ^3.3.1
  pdf: ^3.10.4
  permission_handler: ^12.0.0+1
  step_progress_indicator: ^1.0.2
  string_contains: ^2.4.0
  syncfusion_flutter_charts: ^29.1.37+1
  syncfusion_flutter_core: ^29.1.37
  syncfusion_flutter_pdf: ^29.1.37
#  tflite_flutter: ^0.11.0  # Not used - using server prediction instead
  toast: ^0.3.0
  url_launcher: ^6.1.11
  web_socket_channel: ^2.4.0
  workmanager: ^0.7.0
  youtube_player_flutter: ^9.1.1
#  sendgrid_mailer: ^1.0.0

dependency_overrides:
  plugin_platform_interface: ^2.1.3

dev_dependencies:
  change_app_package_name: ^1.1.0
  dependency_validator: ^5.0.2
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo3.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/logo3.png"
  remove_alpha_ios: true
  image_path_ios: "assets/images/logo3.png"

flutter_native_splash:
  background_image: assets/images/logo3.png

flutter_app_name:
  name: ADDvEEG
